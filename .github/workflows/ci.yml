name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPU wheels keep CI light.
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  test:
    runs-on: [self-hosted, linux, x64, spikeforge-hub-ci]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Least-privilege: this job only reads and never pushes back to
      # spikeforge-hub, so there is no reason to leave a checkout token
      # sitting in the local git config for the rest of the job.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.0"

      - name: Provision matrix Python
        run: |
          uv python install "${{ matrix.python-version }}"
          uv venv --seed --python "${{ matrix.python-version }}" .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      - name: Install torch CPU wheels
        run: |
          python -m pip install --upgrade pip
          # `spikeforge` depends on torchvision>=0.20. Installing only
          # `torch` here left `torchvision` to resolve from the default
          # PyPI index during the next step, which grabbed a build with a
          # mismatched ABI (`RuntimeError: operator torchvision::nms does
          # not exist`) against the CPU-only torch wheel below. Install
          # both from the CPU index up front, matching the main
          # `spikeforge` repo's own CI.
          pip install torch torchvision --index-url ${{ env.TORCH_INDEX_URL }}

      # `capsize-games/spikeforge` is private (pre-launch), so the default
      # GITHUB_TOKEN minted for a spikeforge-hub run has no read access to
      # it and an anonymous HTTPS clone dies non-interactively ("could not
      # read Username for 'https://github.com'"). Rather than a broad PAT,
      # load a deploy key scoped to read-only access on just that one repo
      # (added there as a repo-level deploy key; its private half is stored
      # here as the SPIKEFORGE_DEPLOY_KEY secret) so the fallback below can
      # clone it over SSH instead.
      - name: Load the spikeforge deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SPIKEFORGE_DEPLOY_KEY }}

      - name: Trust github.com's host key
        run: ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Install the core dependency
        run: |
          # Prefer the published core distribution. `spikeforge` 0.3.0 is not
          # on PyPI yet, so fall back to a git checkout of `main` over SSH
          # (see the deploy-key step above) as a stopgap until 0.3.0 is
          # published. `spikeforge` moved into a monorepo
          # (capsize-games/spikeforge) where the installable package lives
          # under `packages/spikeforge`, not the repo root, so the fallback
          # needs the `#subdirectory=` fragment or pip fails with "does not
          # appear to be a Python project".
          pip install "spikeforge~=0.3.0" \
            || pip install "git+ssh://git@github.com/capsize-games/spikeforge.git@main#subdirectory=packages/spikeforge"

      - name: Install spikeforge-hub
        run: pip install -e ".[dev,nir]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest
