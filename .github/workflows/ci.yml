name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPU wheels keep CI light.
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Least-privilege: this job only reads and never pushes back to
      # spikeforge-hub, so there is no reason to leave a checkout token
      # sitting in the local git config for the rest of the job.
      #
      # NOTE: this does NOT fix (and was initially, incorrectly believed
      # to fix) the "Install the core dependency" failure below -- see the
      # comment on that step for the actual, currently-unresolved cause.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install torch CPU wheels
        run: |
          python -m pip install --upgrade pip
          # `spikeforge` depends on torchvision>=0.20. Installing only
          # `torch` here left `torchvision` to resolve from the default
          # PyPI index during the next step, which grabbed a build with a
          # mismatched ABI (`RuntimeError: operator torchvision::nms does
          # not exist`) against the CPU-only torch wheel below. Install
          # both from the CPU index up front, matching the main
          # `spikeforge` repo's own CI.
          pip install torch torchvision --index-url ${{ env.TORCH_INDEX_URL }}

      - name: Install the core dependency
        run: |
          # Prefer the published core distribution. `spikeforge` 0.3.0 is not
          # on PyPI yet, so fall back to a git checkout of `main` as a stopgap
          # until 0.3.0 is published. `spikeforge` moved into a monorepo
          # (capsize-games/spikeforge) where the installable package lives
          # under `packages/spikeforge`, not the repo root, so the fallback
          # needs the `#subdirectory=` fragment or pip fails with "does not
          # appear to be a Python project" -- this part is fixed and verified.
          #
          # KNOWN, CURRENTLY UNRESOLVED: this fallback still cannot succeed
          # in CI today, because `capsize-games/spikeforge` is a *private*
          # repository (pre-launch) and the default `GITHUB_TOKEN` minted
          # for a spikeforge-hub workflow run has no read access to a
          # different, private repo. The anonymous `git clone` below gets a
          # 401 from GitHub, has no credential to answer it with, and dies
          # non-interactively ("could not read Username for
          # 'https://github.com': No such device or address"). This is not
          # a header/credential-persistence bug in this workflow -- it was
          # first (incorrectly) diagnosed as one; adding
          # `persist-credentials: false` above did not fix it, and a repeat
          # CI run confirmed the same failure on all four Python versions.
          # It resolves itself once `spikeforge` is made public alongside
          # the spikeforge.net launch, or sooner if a PAT with read access
          # to both repos is added as a repository secret and embedded as
          # an x-access-token credential in this clone URL. (Deliberately
          # not spelling that out as literal workflow-expression syntax
          # here -- GitHub Actions evaluates any double-curly-brace
          # expression it finds anywhere in a `run:` block, comments
          # included, and a made-up/undefined one broke this workflow's
          # parse the first time this comment was written.) Neither of
          # those is something to decide from inside this workflow file.
          pip install "spikeforge~=0.3.0" \
            || pip install "git+https://github.com/capsize-games/spikeforge.git@main#subdirectory=packages/spikeforge"

      - name: Install spikeforge-hub
        run: pip install -e ".[dev,nir]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest
