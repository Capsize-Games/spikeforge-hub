name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPU wheels keep CI light.
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Least-privilege: this job only reads and never pushes back to
      # spikeforge-hub, so there is no reason to leave a checkout token
      # sitting in the local git config for the rest of the job.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.0"

      - name: Provision matrix Python
        run: |
          uv python install "${{ matrix.python-version }}"
          uv venv --seed --python "${{ matrix.python-version }}" .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      - name: Install torch CPU wheels
        run: |
          python -m pip install --upgrade pip
          # `spikeforge` depends on torchvision>=0.20. Installing only
          # `torch` here left `torchvision` to resolve from the default
          # PyPI index during the next step, which grabbed a build with a
          # mismatched ABI (`RuntimeError: operator torchvision::nms does
          # not exist`) against the CPU-only torch wheel below. Install
          # both from the CPU index up front, matching the main
          # `spikeforge` repo's own CI.
          pip install torch torchvision --index-url ${{ env.TORCH_INDEX_URL }}

      - name: Install the core dependency
        run: |
          # The core repository is public; the fallback needs no credentials.
          pip install "spikeforge~=0.3.0" \
            || pip install "git+https://github.com/Capsize-Games/spikeforge.git@main#subdirectory=packages/spikeforge"

      - name: Install spikeforge-hub
        run: pip install -e ".[dev,nir]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest
